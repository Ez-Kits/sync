name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp run --filter './packages/*' build
      - run: vp test
      # npm stage publish needs npm >= 11.15.0.
      - run: npm install -g npm@^11.15.0
      # The trusted publisher only allows staging. A maintainer approves each
      # staged version with 2FA (npm stage approve, or the Staged Packages tab).
      - name: Stage released packages
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          set -euo pipefail
          npm --version
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          # Stages one package. Called from `if`, where errexit is off, so every
          # step returns on failure itself.
          stage() {
            local dir=$1 name version out tarball log
            name=$(jq -r .name "$dir/package.json") || return 1
            version=$(jq -r .version "$dir/package.json") || return 1
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already published, skipping"
              return 0
            fi
            out=$(mktemp -d "$RUNNER_TEMP/pack.XXXXXX") || return 1
            # pnpm pack and publishing a tarball skip prepublishOnly, so run it first
            # (build, then copy LICENSE, README and docs into the package).
            # pnpm pack rewrites workspace: and catalog: ranges to real versions.
            (cd "$dir" && vp run prepublishOnly && vp pm pack --pack-destination "$out") || return 1
            tarball=$(ls "$out"/*.tgz) || return 1
            # npm view only sees approved versions, so a rerun can hit a version that
            # is already staged. Staged and published versions share one index.
            if log=$(npm stage publish "$tarball" --access public --provenance 2>&1); then
              echo "$log"
              return 0
            fi
            echo "$log"
            if grep -qiE 'already (exists|staged)|previously published|cannot publish over|E409' <<<"$log"; then
              echo "::notice::$name@$version is already staged, skipping"
              return 0
            fi
            return 1
          }

          # Stage every package even if some fail, then fail the job once at the end.
          failed=()
          for dir in $(jq -r '.[]' <<<"$PATHS_RELEASED"); do
            echo "::group::$dir"
            stage "$dir" || failed+=("$dir")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            for dir in "${failed[@]}"; do
              echo "::error::Staging failed for $dir"
            done
            exit 1
          fi
