name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp run --filter './packages/*' build
      - run: vp test
      - name: Publish released packages
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          set -euo pipefail
          npm --version
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          out="$RUNNER_TEMP/packs"
          mkdir -p "$out"
          for dir in $(jq -r '.[]' <<<"$PATHS_RELEASED"); do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already published, skipping"
              continue
            fi
            # pnpm pack and publishing a tarball skip prepublishOnly, so run it first
            # (build, then copy LICENSE, README and docs into the package).
            # pnpm pack rewrites workspace: and catalog: ranges to real versions.
            (cd "$dir" && vp run prepublishOnly && vp pm pack --pack-destination "$out")
            tarball=$(ls "$out"/*.tgz)
            npm publish "$tarball" --access public --provenance
            rm "$tarball"
          done
